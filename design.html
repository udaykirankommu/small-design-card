<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Card</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f2f2f2;
}

.card{
    width:300px;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card-content{
    padding:20px;
    text-align:center;
}

.card-content h2{
    margin-bottom:10px;
    color:#333;
}

.card-content p{
    color:#666;
    font-size:14px;
    margin-bottom:15px;
}

.price{
    font-size:24px;
    color:#28a745;
    font-weight:bold;
    margin-bottom:15px;
}

.btn{
    display:inline-block;
    padding:10px 20px;
    background:#007bff;
    color:white;
    text-decoration:none;
    border-radius:5px;
    transition:0.3s;
}

.btn:hover{
    background:#0056b3;
}
</style>

</head>
<body>

<div class="card">
    <!-- Product Image -->
    <img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=500" alt="Smart Watch">

    <div class="card-content">
        <!-- Product Name -->
        <h2>Smart Watch</h2>

        <!-- Product Description -->
        <p>Track fitness, monitor health, and receive notifications with this stylish smartwatch.</p>

        <!-- Product Price -->
        <div class="price">₹2,999</div>

        <!-- Buy Button -->
        <a href="#" class="btn">Buy Now</a>
    </div>
</div>

</body>
</html>
